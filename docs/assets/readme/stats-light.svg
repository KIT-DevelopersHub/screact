<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 224" width="838" height="224" role="img"><title>直接操作の価値（先行研究）。高齢者の操作時間がマウスより約35%短い（タッチスクリーンとマウスの比較 [1]）。若年者の操作時間がマウスより約16%短い（タッチスクリーンとマウスの比較 [1]）。両手を使う作業では直接タッチが有利（テーブル型ディスプレイでの比較 [2]）。注意：先行研究の結果であり、Screact自体で測った効果ではありません。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECFB"/><stop offset="1" stop-color="#E5F0F3"/></linearGradient><style>
