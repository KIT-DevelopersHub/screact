<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 622" width="324" height="622" role="img"><title>直接操作の価値（先行研究）。高齢者の操作時間が、マウスより約35%短い（タッチスクリーンとマウスの比較 [1]）。若年者の操作時間が、マウスより約16%短い（タッチスクリーンとマウスの比較 [1]）。両手を使う作業では、直接タッチが有利（テーブル型ディスプレイでの比較 [2]）。これらは先行研究の結果であり、Screact自体で測った効果ではない</title><style>@font-face{font-family:ScRounded;font-weight:800;src:url(data:font/woff;base64,) format('woff')}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Hiragino Sans','Yu Gothic UI','Meiryo',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g transform="translate(0 12)"><g transform="translate(0.0 0)"><rect x="1.5" y="1.5" width="321.0" height="183.0" rx="18" fill="#242549" stroke="#6E5CFF" stroke-width="3"/><text x="23.5" y="78.4" class="rnd" font-size="50" font-weight="800" fill="#6E5CFF" text-anchor="start" stroke="#6E5CFF" stroke-width="8.5" stroke-linejoin="round" paint-order="stroke">35%</text><text x="20.0" y="74.0" class="rnd" font-size="50" font-weight="800" fill="#F1DAFD" text-anchor="start" stroke="#2E2E2E" stroke-width="8.5" stroke-linejoin="round" paint-order="stroke">35%</text><text x="18.0" y="108.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">高齢者の操作時間が、</text><text x="18.0" y="130.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">マウスより約35%短い</text><text x="18.0" y="168.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">タッチスクリーンとマウスの比較 [1]</text></g><g transform="translate(0.0 200)"><rect x="1.5" y="1.5" width="321.0" height="183.0" rx="18" fill="#242549" stroke="#6E5CFF" stroke-width="3"/><text x="23.5" y="78.4" class="rnd" font-size="50" font-weight="800" fill="#6E5CFF" text-anchor="start" stroke="#6E5CFF" stroke-width="8.5" stroke-linejoin="round" paint-order="stroke">16%</text><text x="20.0" y="74.0" class="rnd" font-size="50" font-weight="800" fill="#F1DAFD" text-anchor="start" stroke="#2E2E2E" stroke-width="8.5" stroke-linejoin="round" paint-order="stroke">16%</text><text x="18.0" y="108.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">若年者の操作時間が、</text><text x="18.0" y="130.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">マウスより約16%短い</text><text x="18.0" y="168.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">タッチスクリーンとマウスの比較 [1]</text></g><g transform="translate(0.0 400)"><rect x="1.5" y="1.5" width="321.0" height="183.0" rx="18" fill="#242549" stroke="#6E5CFF" stroke-width="3"/><text x="23.5" y="78.4" class="rnd" font-size="50" font-weight="800" fill="#6E5CFF" text-anchor="start" stroke="#6E5CFF" stroke-width="8.5" stroke-linejoin="round" paint-order="stroke">両手</text><text x="20.0" y="74.0" class="rnd" font-size="50" font-weight="800" fill="#F1DAFD" text-anchor="start" stroke="#2E2E2E" stroke-width="8.5" stroke-linejoin="round" paint-order="stroke">両手</text><text x="18.0" y="108.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">両手を使う作業では、</text><text x="18.0" y="130.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">直接タッチが有利</text><text x="18.0" y="168.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">テーブル型ディスプレイでの比較 [2]</text></g></g></svg>
