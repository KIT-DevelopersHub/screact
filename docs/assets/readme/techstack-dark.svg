<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 756" width="838" height="756" role="img"><title>活用した技術。Android（android/・Kotlin）：Kotlin・Jetpack Compose（状態ごとのガイド、接続、設定の画面）、CameraX（背面カメラ・古いフレームは捨てる（KEEP_ONLY_LATEST））、OkHttp WebSocket・UDP（PCの自動発見と、リアルタイムの送信）、Android Keystore（信頼済みの再接続に使うトークンを AES/GCM で保護）。認識（スマホの中で完結）：MediaPipe Hand Landmarker（手指21点・既定は1手、設定で最大2手）、OpenCV ArUco（DICT_4X4_50 の四隅マーカー・ID 10〜13）、解像度のフォールバック（1280×720 → 960×540 → 640×480）。Desktop（desktop/・Flutter）：Flutter・Dart（接続・位置合わせ・オーバーレイ・設定の4画面）、Homography（4点のマーカーから、カメラ座標を画面座標へ）、One-Euro Filter（静止時の揺れを抑え、動き出しの応答は保つ）、ジェスチャー判定（手の大きさで正規化したしきい値と、ヒステリシス）。OSとの連携（ネイティブ）：macOS：Swift・CGEvent（ポインター・クリック・ドラッグ・スクロール）、Windows：C++・Win32・SendInput（実マウス入力と、透明・最前面・クリック透過のウィンドウ）、ショートカット（オーバーレイの解除 ⌘⇧O／Ctrl+Shift+O）。通信（同じLANの中で完結）：UDP :8766（PCの居場所・ポート・6桁コードの広告（自動発見専用））、WebSocket :8765（/ws/v1/input で、認証・位置合わせ・手指21点・状態）、自動再接続（1・2・4・8秒、以後10秒ごとに再試行、ネットワークが戻ればすぐ再接続）。iOS（実験的）（ios/・SwiftUI）：SwiftUI・AVFoundation（Androidと同じ通信の契約で動くクライアント）、NWConnection（RFC 6455 の WebSocket を生のTCPの上に実装）、Bonjour（iPhone ↔ macOS の自動接続を実機で確認）</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1933"/><stop offset="1" stop-color="#14222A"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="267.1666666666667" height="374.5" rx="14" fill="none" stroke="#363A4E" stroke-width="1.5"/><g transform="translate(0.0 0)"><rect x="18" y="18" width="40" height="40" rx="10.0" fill="#3DB5C8"/><g transform="translate(18 18) scale(0.714)"><rect x="14" y="22" width="28" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="4.20" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 22a12 12 0 0 1 24 0M20 12l3 4M36 12l-3 4" fill="none" stroke="#FFFFFF" stroke-width="4.20" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="34" class="gh" font-size="17" font-weight="700" fill="#EEF0F6" text-anchor="start">Android</text><text x="72" y="53" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">android/・Kotlin</text><circle cx="22" cy="81" r="3.5" fill="#3DB5C8"/><text x="34" y="86" class="gh" font-size="14" font-weight="700" fill="#EEF0F6" text-anchor="start">Kotlin・Jetpack Compose</text><text x="34" y="108" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">状態ごとのガイド、接続、設定の画</text><text x="34" y="127" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">面</text><circle cx="22" cy="153" r="3.5" fill="#3DB5C8"/><text x="34" y="158" class="gh" font-size="14" font-weight="700" fill="#EEF0F6" text-anchor="start">CameraX</text><text x="34" y="180" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">背面カメラ・古いフレームは捨てる</text><text x="34" y="199" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">（KEEP_ONLY_LATEST）</text><circle cx="22" cy="225" r="3.5" fill="#3DB5C8"/><text x="34" y="230" class="gh" font-size="14" font-weight="700" fill="#EEF0F6" text-anchor="start">OkHttp WebSocket・UDP</text><text x="34" y="252" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">PCの自動発見と、リアルタイムの送</text><text x="34" y="271" class="gh"