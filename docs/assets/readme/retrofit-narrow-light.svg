<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 448" width="324" height="448" role="img"><title>後付けという選択。必要なのは、手元のスマホとPCと今ある画面だけ。赤外線カメラ、センサー類、電子ペンなどの専用機器はいらず、タッチ対応の画面へ買い替える必要もない</title><style>@font-face{font-family:ScRounded;font-weight:800;src:url(data:font/woff;base64,) format('woff')}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Hiragino Sans','Yu Gothic UI','Meiryo',Helvetica,Arial,sans-serif}
