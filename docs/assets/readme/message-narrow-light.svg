<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 299" width="324" height="299" role="img"><title>情報を映す画面から、情報と関わる画面へ。普通のモニターやマウスでも、説明や会議は成り立ちます。Screactは、そこに「画面を直接さわって動かす」体験を足し、指し示す・書き込む・動かすを、話しながらその場でできるようにします。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECFB"/><stop offset="1" stop-color="#E5F0F3"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><g transform="translate(0 18)"><path d="M1.67 4.14V-4.78L4.82 -12.35H11.33L9.29 -5.06H13.22V4.14ZM16.15 4.14V-4.78L19.3 -12.35H25.81L23.78 -5.06H27.7V4.14Z" fill="url(#brand)"><title>“</title></path><rect x="50" y="80" width="56" height="4" rx="2" fill="url(#brand)"/><text x="50" y="28" class="gh" font-size="20" font-weight="800" fill="#2F2C3E" text-anchor="start">情報を映す画面から、</text><text x="50" y="58" class="gh" font-size="20" font-weight="800" fill="#2F2C3E" text-anchor="start">情報と関わる画面へ。</text><text x="50" y="114" class="gh" font-size="15" font-weight="600" fill="#645F72" text-anchor="start">普通のモニターやマウスでも、</text><text x="50" y="139" class="gh" font-size="15" font-weight="600" fill="#645F72" text-anchor="start">説明や会議は成り立ちます。Screact</text><text x="50" y="164" class="gh" font-size="15" font-weight="600" fill="#645F72" text-anchor="start">は、そこに「画面を直接さわって動か</text><text x="50" y="189" class="gh" font-size="15" font-weight="600" fill="#645F72" text-anchor="start">す」体験を足し、指し示す・書き込む・</text><text x="50" y="214" class="gh" font-size="15" font-weight="600" fill="#645F72" text-anchor="start">動かすを、話しながらその場でできる</text><text x="50" y="239" class="gh" font-size="15" font-weight="600" fill="#645F72" text-anchor="start">ようにします。</text></g></svg>
