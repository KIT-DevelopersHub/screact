<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 340.7" width="838" height="340.7" role="img"><title>できること。描く・消す：描くは人差し指と中指をくっつけて動かす、消すは手をグーにして動かす（透明なオーバーレイに描くので、ブラウザやスライドを隠しません）。クリック・選択：親指と人差し指をつまむ（OSの実際のクリックとして、いつものアプリに届きます）。掴む（ドラッグ）：つまんだまま動かす（ファイルや付箋、ウィンドウを、つまんで運びます）。スクロール：グッドサイン（親指だけを立てる）（親指を向けた方向へ、縦にも横にもスクロールします）。ポインター：人差し指を動かすと動く。設定：各操作は設定画面で1つずつ有効・無効を切り替えられる</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECFB"/><stop offset="1" stop-color="#E5F0F3"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="199.0" height="299.2" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0.0 0)"><rect x="18" y="0" width="164.5" height="3" rx="1.5" fill="#F2669E"/><rect x="18" y="22" width="48" height="48" rx="12.0" fill="#F2669E"/><g transform="translate(18 22) scale(0.857)"><path d="M16 40l20-20 6 6-20 20-9 3z" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 24l6 6" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/></g><text x="182.5" y="40" class="gh" font-size="13" font-weight="700" fill="#F2669E" text-anchor="end" letter-spacing="2">DRAW</text><text x="18" y="102" class="gh" font-size="18" font-weight="700" fill="#2F2C3E" text-anchor="start">描く・消す</text><rect x="18" y="117" width="40.0" height="20" rx="10" fill="none" stroke="#F2669E" stroke-width="1.4"/><text x="38.0" y="131" class="gh" font-size="12.5" font-weight="700" fill="#F2669E" text-anchor="middle">描く</text><text x="66.0" y="132" class="gh" font-size="14" font-weight="700" fill="#2F2C3E" text-anchor="start">人差し指と中指を</text><text x="66.0" y="153" class="gh" font-size="14" font-weight="700" fill="#2F2C3E" text-anchor="start">くっつけて動かす</text><rect x="18" y="166.35" width="40.0" height="20" rx="10" fill="none" stroke="#F2669E" stroke-width="1.4"/><text x="38.0" y="180.35" class="gh" font-size="12.5" font-weight="700" fill="#F2669E" text-anchor="middle">消す</text><text x="66.0" y="181.35" class="gh" font-size="14" font-weight="700" fill="#2F2C3E" text-anchor="start">手をグーにして動</text><text x="66.0" y="202.35" class="gh" font-size="14" font-weight="700" fill="#2F2C3E" text-anchor="start">かす</text><text x="18" y="238.7" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">透明なオーバーレイに描く</text><text x="18" y="258.7" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">ので、ブラウザやスライド</text><text x="18" y="278.7" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">を隠しません</text></g><rect x="213.25" y="0.75" width="199.0" height="299.2" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(212.5 0)"><rect x="18" y="0" width="164.5" height="3" rx="1.5" fill="#6F7DF2"/><rect x="18" y="22" width="48" height="48" rx="12.0" fill="#6F7DF2"/><g transform="translate(18 22) scale(0.857)"><path d="M22 14l18 12-8 2 6 10-4 2-6-10-6 6z" fill="#FFFFFF"/><path d="M14 18l-4-2M18 11l-1-4M12 25H8" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/></g><text x="182.5" y="40" class="gh" font-size="13" font-weight="700" fill="#6F7DF2" text-anchor="end" letter-spacing="2">CLICK</text><text x="18" y="102" class="gh" font-size="18" font-weight="700" fill="#2F2C3E" text-anchor="start">クリック・選択</text><text x="18" y="132" class="gh" font-size="14" font-weight="700" fill="#2F2C3E" text-anchor="start">親指と人差し指をつまむ</text><text x="18" y="161" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">OSの実際のクリックとして、</text><text x="18" y="181" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">いつものアプリに届きます</text></g><rect x="425.75" y="0.75" width="199.0" height="299.2" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(425.0 0)"><rect x="18" y="0" width="164.5" height="3" rx="1.5" fill="#A06BFF"/><rect x="18" y="22" width="48" height="48" rx="12.0" fill="#A06BFF"/><g transform="translate(18 22) scale(0.857)"><rect x="12" y="16" width="20" height="16" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 36l12 8M42 36v8h-8" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/></g><text x="182.5" y="40" class="gh" font-size="13" font-weight="700" fill="#A06BFF" text-anchor="end" letter-spacing="2">DRAG</text><text x="18" y="102" class="gh" font-size="18" font-weight="700" fill="#2F2C3E" text-anchor="start">掴む（ドラッグ）</text><text x="18" y="132" class="gh" font-size="14" font-weight="700" fill="#2F2C3E" text-anchor="start">つまんだまま動かす</text><text x="18" y="161" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">ファイルや付箋、ウィンド</text><text x="18" y="181" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">ウを、つまんで運びます</text></g><rect x="638.25" y="0.75" width="199.0" height="299.2" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(637.5 0)"><rect x="18" y="0" width="164.5" height="3" rx="1.5" fill="#3DB5C8"/><rect x="18" y="22" width="48" height="48" rx="12.0" fill="#3DB5C8"/><g transform="translate(18 22) scale(0.857)"><rect x="20" y="10" width="16" height="36" rx="8" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 18v6M24 34l4 4 4-4" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/></g><text x="182.5" y="40" class="gh" font-size="13" font-weight="700" fill="#3DB5C8" text-anchor="end" letter-spacing="2">SCROLL</text><text x="18" y="102" class="gh" font-size="18" font-weight="700" fill="#2F2C3E" text-anchor="start">スクロール</text><text x="18" y="132" class="gh" font-size="14" font-weight="700" fill="#2F2C3E" text-anchor="start">グッドサイン（親指だけ</text><text x="18" y="153" class="gh" font-size="14" font-weight="700" fill="#2F2C3E" text-anchor="start">を立てる）</text><text x="18" y="182" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">親指を向けた方向へ、縦に</text><text x="18" y="202" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">も横にもスクロールします</text></g></g></svg>
