<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 286" width="838" height="286" role="img"><title>専用の機器を入れる場合との比べ。画面：専用の機器はタッチ対応の画面へ買い替える、Screactは今あるモニター・プロジェクターを使う。追加の機器：専用の機器は赤外線カメラ・センサー・電子ペンなど、Screactはいらない（手元のスマホとPCだけ）。導入：専用の機器は設置の工事や設定、Screactはアプリを入れるだけ。場所：専用の機器は設置した場所に固定、Screactはスマホを持ち運べば、どこでも</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1933"/><stop offset="1" stop-color="#14222A"/></linearGradient><style>
