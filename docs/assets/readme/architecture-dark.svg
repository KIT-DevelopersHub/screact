<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 384" width="838" height="384" role="img"><title>システム構成。スマホ（Android：Kotlin・Jetpack Compose・CameraX／iOS：SwiftUI・AVFoundation、実験的）が、MediaPipe Hand Landmarker で手指21点を、OpenCV ArUco で画面四隅のマーカーを端末の中で認識する。PC（Flutter Desktop）は UDP 8766 で接続情報を広告し、スマホは WebSocket 8765（/ws/v1/input）で座標と状態だけを送る。PCは Homography で画面座標へ変換し、One-Euro Filter で揺れを抑え、ジェスチャーを判定して、透明・クリック透過のオーバーレイへの描画と、OSの実入力（macOS：CGEvent、Windows：SendInput）に変える。それがブラウザ・スライド・PDFなどの既存のアプリに届く。流れる点は、手の動きが画面に届くまでの道</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1933"/><stop offset="1" stop-color="#14222A"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.pk{display:none}}</style></defs><g transform="translate(0 4)"><rect x="0" y="14" width="252" height="232" rx="16" fill="#3DB5C8" fill-opacity=".06" stroke="#3DB5C8" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="16" y="2" width="102.0" height="24" rx="12" fill="#0D1117" stroke="#3DB5C8" stroke-width="1.5"/><text x="67.0" y="18.5" class="gh" font-size="13" font-weight="700" fill="#3DB5C8" text-anchor="middle">スマホ（目）</text><rect x="14" y="42" width="224" height="56" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="14" y="54" width="3" height="32" rx="1.5" fill="#3DB5C8"/><rect x="26" y="52.0" width="36" height="36" rx="9.0" fill="#3DB5C8"/><g transform="translate(26 52.0) scale(0.643)"><circle cx="28" cy="28" r="12" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="28" r="4.5" fill="#FFFFFF"/></g><text x="72" y="67.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">カメラ</text><text x="72" y="87.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">CameraX / AVFoundation</text><rect x="14" y="110" width="224" height="56" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="14" y="122" width="3" height="32" rx="1.5" fill="#3DB5C8"/><rect x="26" y="120.0" width="36" height="36" rx="9.0" fill="#3DB5C8"/><g transform="translate(26 120.0) scale(0.643)"><path d="M8 36l4-6 3 5 3-7 3 6" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M24 30c6-10 12-10 16-4s6 6 9 2" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="135.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">手指21点の認識</text><text x="72" y="155.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">MediaPipe</text><rect x="14" y="178" width="224" height="56" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="14" y="190" width="3" height="32" rx="1.5" fill="#3DB5C8"/><rect x="26" y="188.0" width="36" height="36" rx="9.0" fill="#3DB5C8"/><g transform="translate(26 188.0) scale(0.643)"><path d="M12 18l32-6v32l-32-6z" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 28h32M28 15v26" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="203.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">画面四隅の認識</text><text x="72" y="223.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">OpenCV ArUco</text><rect x="348" y="14" width="490" height="232" rx="16" fill="#6F7DF2" fill-opacity=".06" stroke="#6F7DF2" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="364" y="2" width="182.6" height="24" rx="12" fill="#0D1117" stroke="#6F7DF2" stroke-width="1.5"/><text x="455.3" y="18.5" class="gh" font-size="13" font-weight="700" fill="#6F7DF2" text-anchor="middle">PC（Flutter Desktop）</text><rect x="362.0" y="42" width="146.0" height="56" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="362.0" y="54" width="3" height="32" rx="1.5" fill="#6F7DF2"/><text x="378.0" y="67.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">座標変換</text><text x="378.0" y="87.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">Homography</text><path d="M511.0 65l4 5-4 5" fill="none" stroke="#7A7EF0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="520.0" y="42" width="146.0" height="56" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="520.0" y="54" width="3" height="32" rx="1.5" fill="#6F7DF2"/><text x="536.0" y="67.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">平滑化</text><text x="536.0" y="87.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">One-Euro Filter</text><path d="M669.0 65l4 5-4 5" fill="none" stroke="#7A7EF0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="678.0" y="42" width="146.0" height="56" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="678.0" y="54" width="3" height="32" rx="1.5" fill="#6F7DF2"/><text x="694.0" y="67.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">判定</text><text x="694.0" y="87.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">ジェスチャー</text><rect x="362" y="146" width="225.0" height="56" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="362" y="158" width="3" height="32" rx="1.5" fill="#A06BFF"/><text x="378" y="171.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">描画</text><text x="378" y="191.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">透明オーバーレイ</text><rect x="599.0" y="146" width="225.0" height="56" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="599.0" y="158" width="3" height="32" rx="1.5" fill="#A06BFF"/><text x="615.0" y="171.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">OSの入力</text><text x="615.0" y="191.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">CGEvent／SendInput</text><path d="M751.0 100.0L481.4 142.9" stroke="#7A7EF0" stroke-width="2.6" fill="none"/><path d="M474.5 144.0l7.4 -5.1M474.5 144.0l8.6 2.6" stroke="#7A7EF0" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M751.0 100.0L716.2 138.8" stroke="#7A7EF0" stroke-width="2.6" fill="none"/><path d="M711.5 144.0l2.5 -8.6M711.5 144.0l8.3 -3.4" stroke="#7A7EF0" stroke-width="2.6" stroke-linecap="round" fill="none"/><text x="593.0" y="228" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="middle">クリック透過・最前面のウィンドウ／ネイティブの入力</text><rect x="348" y="292" width="490" height="58" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="348" y="304" width="3" height="34" rx="1.5" fill="#A06BFF"/><rect x="360" y="303.0" width="36" height="36" rx="9.0" fill="#A06BFF"/><g transform="translate(360 303.0) scale(0.643)"><rect x="10" y="12" width="16" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="12" width="16" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="30" width="16" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 32l10 6-4 1 3 5-3 1-3-5-3 3z" fill="#FFFFFF"/></g><text x="406" y="318.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">既存のアプリ</text><text x="406" y="338.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">ブラウザ・スライド・PDF など、いつものアプリをそのまま操作</text><path d="M474.5 248.0L474.5 283.0" stroke="#7A7EF0" stroke-width="2.6" fill="none"/><path d="M474.5 290.0l-3.9 -8.1M474.5 290.0l3.9 -8.1" stroke="#7A7EF0" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M711.5 248.0L711.5 283.0" stroke="#7A7EF0" stroke-width="2.6" fill="none"/><path d="M711.5 290.0l-3.9 -8.1M711.5 290.0l3.9 -8.1" stroke="#7A7EF0" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M258.0 134.0L335.0 134.0" stroke="#7A7EF0" stroke-width="2.6" fill="none"/><path d="M342.0 134.0l-8.1 3.9M342.0 134.0l-8.1 -3.9" stroke="#7A7EF0" stroke-width="2.6" stroke-linecap="round" fill="none"/><text x="300" y="122" class="gh" font-size="13" font-weight="700" fill="#EEF0F6" text-anchor="middle">WebSocket</text><text x="300" y="154" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="middle">:8765</text><path d="M342.0 192.0L265.0 192.0" stroke="#AEB2C2" stroke-width="1.6" fill="none"/><path d="M258.0 192.0l8.1 -3.9M258.0 192.0l8.1 3.9" stroke="#AEB2C2" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="300" y="182" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="middle">UDP :8766</text><text x="300" y="212" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="middle">居場所を広告</text><rect x="0" y="266" width="3" height="40" rx="1.5" fill="url(#brand)"/><text x="14" y="282" class="gh" font-size="13" font-weight="700" fill="#EEF0F6" text-anchor="start">映像は送らない。端末の中で認識し、</text><text x="14" y="302" class="gh" font-size="13" font-weight="700" fill="#EEF0F6" text-anchor="start">座標と状態だけを送る</text><g class="pk"><circle r="6" fill="#7A7EF0"><animateMotion dur="5s" repeatCount="indefinite" path="M212 206V134H435.0V70H751.0V174H474.5V321" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle><circle r="11" fill="#7A7EF0" opacity=".25"><animateMotion dur="5s" repeatCount="indefinite" path="M212 206V134H435.0V70H751.0V174H474.5V321"/></circle></g></g></svg>
