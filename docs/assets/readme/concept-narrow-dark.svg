<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 832" width="324" height="832" role="img"><title>Screactの仕組み。スマホが見る：画面の横に置いたスマホのカメラが、手指の21点と画面の四隅を、端末の中で認識します。。PCへ送る：カメラの映像ではなく、座標と状態だけを、同じLANのPCへリアルタイムに送ります。。画面が応える：PCが座標を画面に合わせ、手の形を操作に変えて、いつものアプリを動かします。</title><style>@font-face{font-family:ScRounded;font-weight:800;src:url(data:font/woff;base64,) format('woff')}
