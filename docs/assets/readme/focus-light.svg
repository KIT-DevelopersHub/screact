<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 502" width="838" height="502" role="img"><title>4つのこだわり。導入の手軽さ（ユーザー操作は最小限）：PCがUDPで居場所を知らせ、スマホが見つけて自動で接続します。位置合わせも、画面の四隅のマーカーを読むだけで終わります。。設置の自由度（スマホは斜めからでもOK）：4つのマーカーからホモグラフィ（射影変換）を求め、斜めから見た座標を画面の座標へ補正します。。操作性（直感的なジェスチャーと滑らかさ）：止めていても揺れる指先を One-Euro Filter で落ち着かせ、動き出しの速さは保ちます。。汎用性（実カーソル入力で、どのアプリでも）：OSの実際の入力としてクリックやスクロールを送り、描画はクリック透過のオーバーレイに重ねます。</title><style>@font-face{font-family:ScRounded;font-weight:800;src:url(data:font/woff;base64,) format('woff')}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Hiragino Sans','Yu Gothic UI','Meiryo',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
