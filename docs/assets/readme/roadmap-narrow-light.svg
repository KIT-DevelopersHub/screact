<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 492" width="324" height="492" role="img"><title>今後の展望。まず：使い続けられる品質へ。通信環境によるカクつきや、意図しない描画を減らします。描き直しのためのUndoや、長い時間使っても安定することを確かめます。。その先：場面に合わせた操作へ。スライドごとに書き込みを残すプレゼンモードや、用途ごとのジェスチャーの組み合わせを、実際に使ってもらいながら形にします。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECFB"/><stop offset="1" stop-color="#E5F0F3"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="322.5" height="202.5" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0 0)"><rect x="22" y="22" width="44" height="44" rx="11.0" fill="#6F7DF2"/><g transform="translate(22 22) scale(0.786)"><path d="M28 9c8 5 10 14 8 24h-16c-2-10 0-19 8-24z" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="22" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 30l-6 8h6M36 30l6 8h-6M24 39l4 7 4-7" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/></g><text x="80" y="37" class="gh" font-size="13" font-weight="700" fill="#645F72" text-anchor="start" letter-spacing="3">NOW</text><text x="80" y="61" class="gh" font-size="20" font-weight="700" fill="#2F2C3E" text-anchor="start">まず</text><text x="22" y="100" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">使い続けられる品質へ</text><text x="22" y="134" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">通信環境によるカクつきや、意図しない描画</text><text x="22" y="156" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">を減らします。描き直しのためのUndoや、</text><text x="22" y="178" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">長い時間使っても安定することを確かめます。</text></g><g transform="translate(162.0 226) rotate(90)"><circle r="15" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><path d="M-5 0h10M1 -5l5 5-5 5" fill="none" stroke="url(#brand)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="0.75" y="248.75" width="322.5" height="202.5" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0 248)"><rect x="22" y="22" width="44" height="44" rx="11.0" fill="#A06BFF"/><g transform="translate(22 22) scale(0.786)"><path d="M16 46V10M16 12h24l-5 8 5 8H16" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/></g><text x="80" y="37" class="gh" font-size="13" font-weight="700" fill="#645F72" text-anchor="start" letter-spacing="3">NEXT</text><text x="80" y="61" class="gh" font-size="20" font-weight="700" fill="#2F2C3E" text-anchor="start">その先</text><text x="22" y="100" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">場面に合わせた操作へ</text><text x="22" y="134" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">スライドごとに書き込みを残すプレゼンモー</text><text x="22" y="156" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">ドや、用途ごとのジェスチャーの組み合わせ</text><text x="22" y="178" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">を、実際に使ってもらいながら形にします。</text></g></g></svg>
