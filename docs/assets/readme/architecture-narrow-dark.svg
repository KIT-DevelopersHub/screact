<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 748" width="324" height="748" role="img"><title>システム構成。スマホ（Android：Kotlin・Jetpack Compose・CameraX／iOS：SwiftUI・AVFoundation、実験的）が、MediaPipe Hand Landmarker で手指21点を、OpenCV ArUco で画面四隅のマーカーを端末の中で認識する。PC（Flutter Desktop）は UDP 8766 で接続情報を広告し、スマホは WebSocket 8765（/ws/v1/input）で座標と状態だけを送る。PCは Homography で画面座標へ変換し、One-Euro Filter で揺れを抑え、ジェスチャーを判定して、透明・クリック透過のオーバーレイへの描画と、OSの実入力（macOS：CGEvent、Windows：SendInput）に変える。それがブラウザ・スライド・PDFなどの既存のアプリに届く。流れる点は、手の動きが画面に届くまでの道</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1933"/><stop offset="1" stop-color="#14222A"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (prefers-reduced-motion:reduce){.pk{display:none}}</style></defs><g transform="translate(0 4)"><rect x="0" y="14" width="324" height="214" rx="16" fill="#3DB5C8" fill-opacity=".06" stroke="#3DB5C8" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="16" y="2" width="102.0" height="24" rx="12" fill="#0D1117" stroke="#3DB5C8" stroke-width="1.5"/><text x="67.0" y="18.5" class="gh" font-size="13" font-weight="700" fill="#3DB5C8" text-anchor="middle">スマホ（目）</text><rect x="14" y="40" width="296" height="50" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="14" y="52" width="3" height="26" rx="1.5" fill="#3DB5C8"/><rect x="26" y="47.0" width="36" height="36" rx="9.0" fill="#3DB5C8"/><g transform="translate(26 47.0) scale(0.643)"><circle cx="28" cy="28" r="12" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="28" r="4.5" fill="#FFFFFF"/></g><text x="72" y="62.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">カメラ</text><text x="72" y="82.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">CameraX / AVFoundation</text><rect x="14" y="102" width="296" height="50" rx="12" fill="#1B1F2B" stroke="#363A4E" stroke-width="1.5"/><rect x="14" y="114" width="3" height="26" rx="1.5" fill="#3DB5C8"/><rect x="26" y="109.0" width="36" height="36" rx="9.0" fill="#3DB5C8"/><g transform="translate(26 109.0) scale(0.643)"><path d="M8 36l4-6 3 5 3-7 3 6" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M24 30c6-10 12-10 16-4s6 6 9 2" fill="none" stroke="#FFFFFF" stroke-width="4.67" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="124.0" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">手指21点の認識</text><text x="72" y="144.0" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">Medi