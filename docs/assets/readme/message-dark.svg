<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 217" width="838" height="217" role="img"><title>情報を映す画面から、情報と関わる画面へ。普通のモニターやマウスでも、説明や会議は成り立ちます。Screactは、そこに「画面を直接さわって動かす」体験を足し、指し示す・書き込む・動かすを、話しながらその場でできるようにします。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1933"/><stop offset="1" stop-color="#14222A"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><g transform="translate(0 18)"><path d="M2.33 5.8V-6.69L6.74 -17.29H15.87L13.01 -7.08H18.5V5.8ZM22.61 5.8V-6.69L27.02 -17.29H36.14L33.29 -7.08H38.78V5.8Z" fill="url(#brand)"><title>“</title></path><rect x="66" y="98" width="56" height="4" rx="2" fill="url(#brand)"/><text x="66" y="36" class="gh" font-size="28" font-weight="800" fill="#EEF0F6" text-anchor="start">情報を映す画面から、</text><text x="66" y="76" class="gh" font-size="28" font-weight="800" fill="#EEF0F6" text-anchor="start">情報と関わる画面へ。</text><text x="66" y="132" class="gh" font-size="15" font-weight="600" fill="#AEB2C2" text-anchor="start">普通のモニターやマウスでも、説明や会議は成り立ちます。Screactは、そこに「画面を直接さわって動かす」</text><text x="66" y="157" class="gh" font-size="15" font-weight="600" fill="#AEB2C2" text-anchor="start">体験を足し、指し示す・書き込む・動かすを、話しながらその場でできるようにします。</text><g transform="translate(778.0 86.0) scale(0.5000)"><g class="float" style="animation-delay:0.40s"><g transform="translate(-60 -89)"><path d="M60 4C86 4 99 21 103 43C106 58 109 66 115 72C121 78 118 85 109 85C96 86 88 82 78 84C70 86 66 89 60 89C54 89 50 86 42 84C32 82 24 86 11 85C2 85-1 78 5 72C11 66 14 58 17 43C21 21 34 4 60 4Z" fill="#FAFAFA" stroke="#424242" stroke-width="4.5" stroke-linejoin="round"/><g class="blink"><circle cx="60" cy="34" r="12.5" fill="#B4CACA" stroke="#424242" stroke-width="5"/><circle cx="60" cy="35" r="4.6" fill="#2F2F2F"/><circle cx="61.6" cy="36.8" r="1.4" fill="#FFFFFF"/></g></g></g></g></g></svg>
