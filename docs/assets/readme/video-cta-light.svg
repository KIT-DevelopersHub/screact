<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 60" width="838" height="60" role="img"><title>デモ動画を見る（Google Drive・約33秒）</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECFB"/><stop offset="1" stop-color="#E5F0F3"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect x="0.75" y="0.75" width="836.5" height="58.5" rx="12" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><circle cx="34" cy="30.0" r="17" fill="url(#brand)"/><path d="M29 22.5L41 30.0L29 37.5Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/><text x="64" y="27" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">デモ動画を見る</text><text x="64" y="46" class="gh" font-size="13" font-weight="600" fill="#645F72" text-anchor="start">Google Driveで再生します（約33秒）</text><path d="M810 23.0l7 7-7 7" fill="none" stroke="#645F72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
