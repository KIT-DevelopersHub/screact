<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 506" width="324" height="506" role="img"><title>専用の機器を入れる場合との比べ。画面：専用の機器はタッチ対応の画面へ買い替える、Screactは今あるモニター・プロジェクターを使う。追加の機器：専用の機器は赤外線カメラ・センサー・電子ペンなど、Screactはいらない（手元のスマホとPCだけ）。導入：専用の機器は設置の工事や設定、Screactはアプリを入れるだけ。場所：専用の機器は設置した場所に固定、Screactはスマホを持ち運べば、どこでも</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1933"/><stop offset="1" stop-color="#14222A"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><g transform="translate(0 10)"><text x="0" y="16" class="gh" font-size="14" font-weight="700" fill="#AEB2C2" text-anchor="start">専用の機器を入れる場合と比べて</text><rect x="0.75" y="30.75" width="322.5" height="101.5" rx="14" fill="none" stroke="#363A4E" stroke-width="1.5"/><g transform="translate(0 30)"><text x="16" y="30" class="gh" font-size="13" font-weight="700" fill="#AEB2C2" text-anchor="start" letter-spacing="1">画面</text><path d="M16 79l8 0" stroke="none"/><path d="M17 79l6 6 6-6" fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 23 82)"/><text x="16" y="56" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">タッチ対応の画面へ買い替える</text><text x="36" y="85" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">今あるモニター・プロジェクターを使う</text></g><rect x="0.75" y="141.75" width="322.5" height="101.5" rx="14" fill="none" stroke="#363A4E" stroke-width="1.5"/><g transform="translate(0 141)"><text x="16" y="30" class="gh" font-size="13" font-weight="700" fill="#AEB2C2" text-anchor="start" letter-spacing="1">追加の機器</text><path d="M16 79l8 0" stroke="none"/><path d="M17 79l6 6 6-6" fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 23 82)"/><text x="16" y="56" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">赤外線カメラ・センサー・電子ペンなど</text><text x="36" y="85" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">いらない（手元のスマホとPCだけ）</text></g><rect x="0.75" y="252.75" width="322.5" height="101.5" rx="14" fill="none" stroke="#363A4E" stroke-width="1.5"/><g transform="translate(0 252)"><text x="16" y="30" class="gh" font-size="13" font-weight="700" fill="#AEB2C2" text-anchor="start" letter-spacing="1">導入</text><path d="M16 79l8 0" stroke="none"/><path d="M17 79l6 6 6-6" fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 23 82)"/><text x="16" y="56" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">設置の工事や設定</text><text x="36" y="85" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">アプリを入れるだけ</text></g><rect x="0.75" y="363.75" width="322.5" height="101.5" rx="14" fill="none" stroke="#363A4E" stroke-width="1.5"/><g transform="translate(0 363)"><text x="16" y="30" class="gh" font-size="13" font-weight="700" fill="#AEB2C2" text-anchor="start" letter-spacing="1">場所</text><path d="M16 79l8 0" stroke="none"/><path d="M17 79l6 6 6-6" fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 23 82)"/><text x="16" y="56" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start">設置した場所に固定</text><text x="36" y="85" class="gh" font-size="15" font-weight="700" fill="#EEF0F6" text-anchor="start">スマホを持ち運べば、どこでも</text></g></g></svg>
