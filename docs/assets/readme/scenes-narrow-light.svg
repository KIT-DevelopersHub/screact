<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 684" width="324" height="684" role="img"><title>利用場面。会議・共同作業：情報を動かしながら、一緒に考える。注目している箇所や意図を、その場で共有できます。画面を囲んだ全員が、対話や共同作業に加わりやすくなります。。授業・プレゼン：説明・身振り・操作がひとつになる。説明する人は画面の前から離れず、伝えることに集中できます。聞く人も、どこを見ればよいかをつかみやすくなります。。接客・相談・提案：同じ情報を指しながら対話する。相手の反応や質問に合わせて、その場で書き込みながら説明できます。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECFB"/><stop offset="1" stop-color="#E5F0F3"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="322.5" height="212.5" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0 0)"><rect x="18" y="18" width="44" height="44" rx="11.0" fill="#6F7DF2"/><g transform="translate(18 18) scale(0.786)"><circle cx="20" cy="20" r="5" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="20" r="5" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 40c1-7 5-10 9-10s8 3 9 10M27 40c1-7 5-10 9-10s8 3 9 10" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="34" class="gh" font-size="13" font-weight="700" fill="#6F7DF2" text-anchor="start" letter-spacing="2">MEETING</text><text x="76" y="56" class="gh" font-size="17" font-weight="700" fill="#2F2C3E" text-anchor="start">会議・共同作業</text><rect x="18" y="72" width="40" height="3" rx="1.5" fill="#6F7DF2"/><text x="18" y="92" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">情報を動かしながら、</text><text x="18" y="116" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">一緒に考える。</text><text x="18" y="148" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">注目している箇所や意図を、その場で共有で</text><text x="18" y="170" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">きます。画面を囲んだ全員が、対話や共同作</text><text x="18" y="192" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">業に加わりやすくなります。</text></g><rect x="0.75" y="226.75" width="322.5" height="212.5" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0 226)"><rect x="18" y="18" width="44" height="44" rx="11.0" fill="#F2669E"/><g transform="translate(18 18) scale(0.786)"><rect x="10" y="12" width="36" height="22" rx="2" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 28l7-7 5 4 9-8" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 44l6-10 6 10" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="34" class="gh" font-size="13" font-weight="700" fill="#F2669E" text-anchor="start" letter-spacing="2">CLASS</text><text x="76" y="56" class="gh" font-size="17" font-weight="700" fill="#2F2C3E" text-anchor="start">授業・プレゼン</text><rect x="18" y="72" width="40" height="3" rx="1.5" fill="#F2669E"/><text x="18" y="92" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">説明・身振り・操作が</text><text x="18" y="116" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">ひとつになる。</text><text x="18" y="148" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">説明する人は画面の前から離れず、伝えるこ</text><text x="18" y="170" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">とに集中できます。聞く人も、どこを見れば</text><text x="18" y="192" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">よいかをつかみやすくなります。</text></g><rect x="0.75" y="452.75" width="322.5" height="190.5" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0 452)"><rect x="18" y="18" width="44" height="44" rx="11.0" fill="#3DB5C8"/><g transform="translate(18 18) scale(0.786)"><path d="M10 14h22v14H20l-6 5v-5h-4z" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 22h10v14h-4v5l-6-5h-10v-4" fill="none" stroke="#FFFFFF" stroke-width="3.82" stroke-linecap="round" stroke-linejoin="round"/></g><text x="76" y="34" class="gh" font-size="13" font-weight="700" fill="#3DB5C8" text-anchor="start" letter-spacing="2">CONSULTING</text><text x="76" y="56" class="gh" font-size="17" font-weight="700" fill="#2F2C3E" text-anchor="start">接客・相談・提案</text><rect x="18" y="72" width="40" height="3" rx="1.5" fill="#3DB5C8"/><text x="18" y="92" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">同じ情報を指しながら</text><text x="18" y="116" class="gh" font-size="16" font-weight="700" fill="#2F2C3E" text-anchor="start">対話する。</text><text x="18" y="148" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">相手の反応や質問に合わせて、その場で書き</text><text x="18" y="170" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">込みながら説明できます。</text></g></g></svg>
