<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 40" width="324" height="40" role="img"><title>受賞・出展</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1933"/><stop offset="1" stop-color="#14222A"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><text x="0" y="31" class="gh" font-size="24" font-weight="700" fill="#EEF0F6" text-anchor="start">受賞・出展</text><text x="132" y="30" class="gh" font-size="13" font-weight="600" fill="#AEB2C2" text-anchor="start" letter-spacing="4">AWARDS</text><rect x="220" y="24.5" width="51" height="1.5" rx=".75" fill="#363A4E"/><circle cx="281" cy="25.25" r="4" fill="#F2669E"/><circle cx="294" cy="25.25" r="4" fill="#6F7DF2"/><circle cx="307" cy="25.25" r="4" fill="#A06BFF"/><circle cx="320" cy="25.25" r="4" fill="#3DB5C8"/></svg>
