<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 514" width="324" height="514" role="img"><title>製品の仕組み。STEP 1：スマホが「見る」。画面の横に置いたスマホのカメラが、手指の21点と画面の四隅を、端末の中で認識します。。STEP 2：PCへ「送る」。カメラの映像ではなく、座標と状態だけを、同じLANのPCへリアルタイムに送ります。。STEP 3：画面が「応える」。PCが座標を画面に合わせ、手の形を操作に変えて、いつものアプリを動かします。</title><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A06BFF"/><stop offset=".55" stop-color="#7A7EF0"/><stop offset="1" stop-color="#3DB5C8"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1ECFB"/><stop offset="1" stop-color="#E5F0F3"/></linearGradient><style>
.jp{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif}
.disp{font-family:Impact,Haettenschweiler,'Anton','Arial Narrow Bold','Arial Black',sans-serif}
.gh{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.rnd{font-family:ScRounded,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.hand{font-family:ScHand,'Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',monospace}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flow{to{stroke-dashoffset:-28}}
.float{animation:float 3.2s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><g transform="translate(0 10)"><rect x="0.75" y="0.75" width="322.5" height="156.5" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0 0)"><rect x="18" y="18" width="48" height="48" rx="12.0" fill="#3DB5C8"/><g transform="translate(18 18) scale(0.857)"><circle cx="28" cy="28" r="12" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="28" r="4.5" fill="#FFFFFF"/></g><rect x="80" y="20" width="66.8" height="22" rx="11.0" fill="#3DB5C8"/><text x="113.4" y="35.68" class="gh" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 1</text><text x="80" y="64" class="gh" font-size="17" font-weight="700" fill="#2F2C3E" text-anchor="start">スマホが「見る」</text><text x="18" y="92" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">画面の横に置いたスマホのカメラが、</text><text x="18" y="114" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">手指の21点と画面の四隅を、端末の中で認識</text><text x="18" y="136" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">します。</text></g><path d="M155.0 164l7 7 7-7" fill="none" stroke="url(#brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="0.75" y="180.75" width="322.5" height="134.5" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0 180)"><rect x="18" y="18" width="48" height="48" rx="12.0" fill="#6F7DF2"/><g transform="translate(18 18) scale(0.857)"><path d="M14 22a20 20 0 0 1 28 0M19 28a12 12 0 0 1 18 0" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="35" r="3.5" fill="#FFFFFF"/></g><rect x="80" y="20" width="66.8" height="22" rx="11.0" fill="#6F7DF2"/><text x="113.4" y="35.68" class="gh" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 2</text><text x="80" y="64" class="gh" font-size="17" font-weight="700" fill="#2F2C3E" text-anchor="start">PCへ「送る」</text><text x="18" y="92" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">カメラの映像ではなく、座標と状態だけを、</text><text x="18" y="114" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">同じLANのPCへリアルタイムに送ります。</text></g><path d="M155.0 322l7 7 7-7" fill="none" stroke="url(#brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="0.75" y="338.75" width="322.5" height="134.5" rx="14" fill="none" stroke="#DAD6E6" stroke-width="1.5"/><g transform="translate(0 338)"><rect x="18" y="18" width="48" height="48" rx="12.0" fill="#A06BFF"/><g transform="translate(18 18) scale(0.857)"><rect x="10" y="12" width="16" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="12" width="16" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="30" width="16" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3.50" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 32l10 6-4 1 3 5-3 1-3-5-3 3z" fill="#FFFFFF"/></g><rect x="80" y="20" width="66.8" height="22" rx="11.0" fill="#A06BFF"/><text x="113.4" y="35.68" class="gh" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 3</text><text x="80" y="64" class="gh" font-size="17" font-weight="700" fill="#2F2C3E" text-anchor="start">画面が「応える」</text><text x="18" y="92" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">PCが座標を画面に合わせ、手の形を操作に変</text><text x="18" y="114" class="gh" font-size="14" font-weight="400" fill="#645F72" text-anchor="start">えて、いつものアプリを動かします。</text></g></g></svg>
