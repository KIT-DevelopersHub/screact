name: Screact
options:
  bundleIdPrefix: com.nxtend.team35
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  # OpenCV 4.9 for the ArUco DICT_4X4_50 detector used by Vision/ArucoBridge.mm.
  # Delivered as a prebuilt opencv2.xcframework via Swift Package (the `OpenCV` CocoaPod stops at
  # 4.3.0 and lacks the `cv::aruco::ArucoDetector` API that OpenCV 4.7+ exposes in `objdetect`).
  OpenCV:
    url: https://github.com/yeatse/opencv-spm.git
    exactVersion: 4.9.0

targets:
  Screact:
    type: application
    platform: iOS
    sources:
      - path: Screact
        excludes:
          - "App/Info.plist"
          - "Resources/MODEL_ATTRIBUTION.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nxtend.team35.yubiboard
        PRODUCT_NAME: Screact
        INFOPLIST_FILE: Screact/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Screact/Screact-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Code signing is left unset so `xcodebuild ... -sdk iphonesimulator` builds without a team.
    dependencies:
      # OpenCV 4.9 xcframework (opencv2 module) — enables the __has_include(<opencv2/opencv.hpp>)
      # path in ArucoBridge.mm so ArUco marker detection is compiled in.
      - package: OpenCV
        product: OpenCV

  ScreactTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScreactTests
    dependencies:
      - target: Screact
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nxtend.team35.yubiboard.tests
        GENERATE_INFOPLIST_FILE: YES
